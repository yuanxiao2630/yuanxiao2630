<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="384" viewBox="0 0 1200 384" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">yuanxiao2630 — Small tools. Better flow.</title>
  <desc id="desc">A dark green personal banner with a mango yellow note and small interface illustrations.</desc>
  <defs>
